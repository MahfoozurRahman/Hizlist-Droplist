name: Daily find

on:
  schedule:
    # 04:00 UTC = 07:00 Europe/Istanbul (adjust to taste; cron is always UTC)
    - cron: "0 4 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic

      - name: Generate today's find
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_daily.py

      - name: Commit updated data
        run: |
          git config user.name "droplist-bot"
          git config user.email "actions@github.com"
          git add daily_today.json daily_history.json
          git diff --quiet --cached || git commit -m "Daily find: $(date -u +%F)"
          git push
